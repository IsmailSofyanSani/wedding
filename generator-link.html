<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Link Undangan - Ranny & Sofyan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #B8935A;
            --primary-dark: #A07D4D;
            --primary-light: #D4B485;
            --secondary: #E5D5D2;
            --accent: #8A9A7B;
            --bg-primary: #FBF6F0;
            --bg-secondary: #F4E4E1;
            --text-primary: #2C2424;
            --text-secondary: #6B5F5A;
            --border: #E5E5E5;
            --success: #4CAF50;
            --info: #2196F3;
            --warning: #FF9800;
            --error: #F44336;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #FBF6F0 0%, #F4E4E1 50%, #E5D5D2 100%);
            padding: 0;
            margin: 0;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(184, 147, 90, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 154, 123, 0.08) 0%, transparent 50%);
            animation: backgroundMove 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        
        @keyframes backgroundMove {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-5%, -5%); }
        }
        
        .wrapper {
            position: relative;
            z-index: 1;
            padding: 20px;
        }
        
        /* Modern Header with Glassmorphism */
        .header {
            max-width: 1400px;
            margin: 0 auto 32px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(184, 147, 90, 0.05), transparent);
            animation: shimmer 3s infinite;
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .header-content {
            position: relative;
            z-index: 1;
        }
        
        .header-icon {
            font-size: 48px;
            margin-bottom: 16px;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -1px;
        }
        
        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 500;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* Modern Stats Cards with 3D Effect */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 32px 24px;
            border-radius: 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(184, 147, 90, 0.3);
            cursor: pointer;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent);
            opacity: 0;
            transition: opacity 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 20px 40px rgba(184, 147, 90, 0.4);
        }
        
        .stat-card:hover::before {
            opacity: 1;
        }
        
        .stat-icon {
            font-size: 36px;
            margin-bottom: 12px;
            display: inline-block;
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .stat-number {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 8px;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }
        
        .stat-label {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.95;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* Modern Grid */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }
        
        @media (max-width: 1024px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
        
        /* Modern Cards with Glassmorphism */
        .card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 32px;
            border-radius: 24px;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.08),
                inset 0 1px 0 rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.5s;
        }
        
        .card:hover::before {
            left: 100%;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }
        
        .card-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(184, 147, 90, 0.3);
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            flex: 1;
        }
        
        .card-badge {
            background: var(--primary);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .card-description {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        
        /* Modern Form Elements */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        label::before {
            content: '●';
            color: var(--primary);
            font-size: 8px;
        }
        
        input[type="text"],
        select {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 4px 16px rgba(184, 147, 90, 0.15);
            transform: translateY(-2px);
        }
        
        .input-icon {
            position: absolute;
            left: 14px;
            top: 42px;
            font-size: 18px;
            color: var(--text-secondary);
            pointer-events: none;
        }
        
        /* Modern Buttons */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(184, 147, 90, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(184, 147, 90, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4CAF50, #45A049);
            color: white;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }
        
        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(76, 175, 80, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: var(--text-primary);
            border: 2px solid var(--border);
        }
        
        .btn-secondary:hover {
            border-color: var(--primary);
            background: var(--bg-primary);
        }
        
        .btn-small {
            padding: 8px 16px;
            font-size: 13px;
        }
        
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
        }
        
        /* Modern Alert */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            line-height: 1.6;
            border-left: 4px solid;
            animation: slideInDown 0.3s ease;
        }
        
        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .alert-icon {
            font-size: 20px;
            flex-shrink: 0;
        }
        
        .alert-info {
            background: linear-gradient(135deg, #E3F2FD, #BBDEFB);
            color: #1565C0;
            border-left-color: #2196F3;
        }
        
        /* Modern Result Box */
        .result-box {
            background: linear-gradient(135deg, #F9F9F9, #FFFFFF);
            padding: 24px;
            border-radius: 16px;
            margin-top: 20px;
            border: 2px solid var(--primary);
            display: none;
            animation: scaleIn 0.3s ease;
        }
        
        .result-box.show {
            display: block;
        }
        
        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .result-label {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 13px;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .result-link {
            background: white;
            padding: 16px;
            border-radius: 10px;
            border: 2px dashed var(--primary);
            color: var(--primary);
            font-size: 14px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            margin-bottom: 16px;
            font-weight: 600;
        }
        
        .whatsapp-box {
            background: linear-gradient(135deg, #E8F5E9, #C8E6C9);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #25D366;
            margin-top: 16px;
        }
        
        .whatsapp-preview {
            background: white;
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-primary);
            white-space: pre-wrap;
            margin: 12px 0;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        
        /* Modern Guest List */
        .search-box {
            position: relative;
            margin-bottom: 20px;
        }
        
        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-secondary);
            pointer-events: none;
        }
        
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .filter-bar select {
            flex: 1;
            min-width: 200px;
            padding-left: 16px;
        }
        
        .guest-list-container {
            max-height: 600px;
            overflow-y: auto;
            padding-right: 8px;
        }
        
        .guest-list-container::-webkit-scrollbar {
            width: 8px;
        }
        
        .guest-list-container::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
        }
        
        .guest-list-container::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        
        .guest-item {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }
        
        .guest-item:hover {
            background: linear-gradient(135deg, white, #FAFAFA);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            transform: translateX(8px);
            border-left-width: 6px;
        }
        
        .guest-info {
            flex: 1;
        }
        
        .guest-name {
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-size: 15px;
        }
        
        .guest-category {
            font-size: 12px;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--primary));
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(138, 154, 123, 0.3);
        }
        
        .guest-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        
        /* Modern Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: linear-gradient(135deg, var(--success), #45A049);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            font-weight: 600;
        }
        
        .toast.show {
            display: flex;
        }
        
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .empty-icon {
            font-size: 72px;
            margin-bottom: 16px;
            opacity: 0.4;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .empty-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .empty-subtext {
            font-size: 14px;
        }
        
        /* Loading Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .wrapper {
                padding: 16px;
            }
            
            .header {
                padding: 32px 24px;
            }
            
            h1 {
                font-size: 28px;
            }
            
            .card {
                padding: 24px 20px;
            }
            
            .guest-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 16px;
            }
            
            .guest-actions {
                width: 100%;
            }
            
            .guest-actions .btn {
                flex: 1;
            }
            
            .stat-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Modern Header -->
        <div class="header">
            <div class="header-content">
                <div class="header-icon">💍</div>
                <h1>Generator Link Undangan</h1>
                <p class="subtitle">Dashboard Modern - Ranny & Sofyan Wedding</p>
            </div>
        </div>
        
        <div class="container">
            <!-- Modern Statistics -->
            <div class="stats">
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-number" id="totalGuests">0</div>
                    <div class="stat-label">Total Tamu</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👨‍👩‍👧‍👦</div>
                    <div class="stat-number" id="totalFamily">0</div>
                    <div class="stat-label">Keluarga</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">🤝</div>
                    <div class="stat-number" id="totalFriends">0</div>
                    <div class="stat-label">Teman</div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">✨</div>
                    <div class="stat-number" id="totalOthers">0</div>
                    <div class="stat-label">Lainnya</div>
                </div>
            </div>
            
            <!-- Modern Grid -->
            <div class="grid">
                <!-- Left Column: Generate Link -->
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">🔗</div>
                            <div class="card-title">Generate Link</div>
                        </div>
                        <p class="card-description">Buat link personal untuk tamu undangan</p>
                        
                        <div class="form-group">
                            <label for="guestName">Nama Tamu</label>
                            <span class="input-icon">🔍</span>
                            <input type="text" id="guestName" placeholder="Ketik atau pilih dari daftar" />
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn btn-primary" onclick="generateLink()">
                                <span>🔗</span> Generate Link
                            </button>
                            <button class="btn btn-success" onclick="generateWhatsApp()">
                                <span>💬</span> WhatsApp
                            </button>
                        </div>
                        
                        <div class="result-box" id="linkResult">
                            <div class="result-label">
                                <span>🔗</span> Link Undangan
                            </div>
                            <div class="result-link" id="generatedLink"></div>
                            <button class="btn btn-secondary btn-small" onclick="copyLink()">
                                📋 Copy Link
                            </button>
                            
                            <div class="whatsapp-box" id="whatsappBox" style="display: none;">
                                <div class="result-label" style="color: #25D366;">
                                    <span>💬</span> Preview WhatsApp
                                </div>
                                <div class="whatsapp-preview" id="whatsappText"></div>
                                <div class="btn-group" style="margin-top: 12px;">
                                    <button class="btn btn-secondary btn-small" onclick="copyWhatsApp()">
                                        📋 Copy Pesan
                                    </button>
                                    <button class="btn btn-success btn-small" onclick="openWhatsApp()">
                                        💬 Buka WA
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Right Column: Daftar Tamu -->
                <div>
                    <div class="card">
                        <div class="card-header">
                            <div class="card-icon">👥</div>
                            <div class="card-title">Daftar Tamu</div>
                            <div class="card-badge" id="guestCount">0</div>
                        </div>
                        <p class="card-description">Kelola dan generate link untuk semua tamu</p>
                        
                        <!-- Search -->
                        <div class="search-box">
                            <span class="search-icon">🔍</span>
                            <input type="text" id="searchGuest" placeholder="Cari nama tamu..." onkeyup="searchGuests()" />
                        </div>
                        
                        <!-- Filter -->
                        <div class="filter-bar">
                            <select id="filterCategory" onchange="displayGuestList()">
                                <option value="Semua">Semua Kategori</option>
                                <option value="Keluarga">Keluarga</option>
                                <option value="Teman">Teman</option>
                                <option value="Kerja">Kerja</option>
                                <option value="Teman Mempelai Pria">Teman Mempelai Pria</option>
                            </select>
                        </div>
                        
                        <!-- Actions -->
                        <div class="btn-group">
                            <button class="btn btn-secondary btn-small" onclick="generateAllLinks()">
                                📥 Download
                            </button>
                            <button class="btn btn-secondary btn-small" onclick="exportToCSV()">
                                📊 CSV
                            </button>
                        </div>
                        
                        <!-- Guest List -->
                        <div class="guest-list-container" id="guestList" style="margin-top: 20px;">
                            <!-- Guests will be loaded here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Toast -->
    <div class="toast" id="toast">
        <span style="font-size: 24px;">✅</span>
        <span id="toastMessage">Berhasil!</span>
    </div>
    
    <script src="./daftar-tamu.js"></script>
    <script>
        const BASE_URL = 'https://theweddingofrannysofyan.vercel.app/';
        
        let currentGeneratedLink = '';
        let currentGeneratedMessage = '';
        
        const WHATSAPP_TEMPLATE = (nama) => `
Assalamualaikum Warahmatullahi Wabarakatuh 

Yth. *${nama}*

Tanpa mengurangi rasa hormat, perkenankan kami mengundang Bapak/Ibu/Saudara/i untuk menghadiri acara pernikahan kami:

*Ranny & Sofyan*
📅 Jum'at, 08 Januari 2027

Untuk informasi lengkap acara, waktu, dan lokasi dapat dilihat pada undangan digital berikut:
{{LINK}}

Merupakan suatu kebahagiaan tersendiri bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu.

Atas perhatian dan doa restunya, kami ucapkan terima kasih.

Wassalamualaikum Warahmatullahi Wabarakatuh 

Hormat kami,
*Ranny & Sofyan*
        `.trim();
        
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }
        
        function init() {
            displayGuestList();
            updateStats();
        }
        
        function updateStats() {
            const total = daftarTamu.length;
            const family = daftarTamu.filter(t => t.kategori === 'Keluarga').length;
            const friends = daftarTamu.filter(t => t.kategori === 'Teman' || t.kategori === 'Teman Mempelai Wanita').length;
            const others = total - family - friends;
            
            document.getElementById('totalGuests').textContent = total;
            document.getElementById('totalFamily').textContent = family;
            document.getElementById('totalFriends').textContent = friends;
            document.getElementById('totalOthers').textContent = others;
            document.getElementById('guestCount').textContent = total;
        }
        
        function displayGuestList() {
            const filter = document.getElementById('filterCategory').value;
            const searchTerm = document.getElementById('searchGuest').value.toLowerCase();
            const guestListDiv = document.getElementById('guestList');
            
            let filteredGuests = daftarTamu;
            
            if (filter !== 'Semua') {
                filteredGuests = filteredGuests.filter(guest => guest.kategori === filter);
            }
            
            if (searchTerm) {
                filteredGuests = filteredGuests.filter(guest => 
                    guest.nama.toLowerCase().includes(searchTerm)
                );
            }
            
            if (filteredGuests.length === 0) {
                guestListDiv.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <div class="empty-text">Tidak ada tamu</div>
                        <div class="empty-subtext">Coba ubah filter</div>
                    </div>
                `;
                return;
            }
            
            guestListDiv.innerHTML = filteredGuests.map(guest => `
                <div class="guest-item">
                    <div class="guest-info">
                        <div class="guest-name">${guest.nama}</div>
                        <span class="guest-category">${guest.kategori}</span>
                    </div>
                    <div class="guest-actions">
                        <button class="btn btn-primary btn-small" onclick="selectGuest('${escapeHtml(guest.nama)}')">
                            Pilih
                        </button>
                        <button class="btn btn-success btn-small" onclick="quickWhatsApp('${escapeHtml(guest.nama)}')">
                            💬
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function searchGuests() {
            displayGuestList();
        }
        
        function escapeHtml(text) {
            return text.replace(/'/g, "\\'");
        }
        
        function selectGuest(name) {
            document.getElementById('guestName').value = name;
            document.getElementById('guestName').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function generateLink() {
            const name = document.getElementById('guestName').value.trim();
            
            if (!name) {
                showToast('⚠️ Masukkan nama tamu!');
                return;
            }
            
            const encodedName = encodeURIComponent(name);
            const link = `${BASE_URL}?to=${encodedName}`;
            
            currentGeneratedLink = link;
            
            document.getElementById('generatedLink').textContent = link;
            document.getElementById('linkResult').classList.add('show');
            document.getElementById('whatsappBox').style.display = 'none';
            
            showToast('✅ Link di-generate!');
        }
        
        function generateWhatsApp() {
            const name = document.getElementById('guestName').value.trim();
            
            if (!name) {
                showToast('⚠️ Masukkan nama tamu!');
                return;
            }
            
            const encodedName = encodeURIComponent(name);
            const link = `${BASE_URL}?to=${encodedName}`;
            const message = WHATSAPP_TEMPLATE(name).replace('{{LINK}}', link);
            
            currentGeneratedLink = link;
            currentGeneratedMessage = message;
            
            document.getElementById('generatedLink').textContent = link;
            document.getElementById('whatsappText').textContent = message;
            document.getElementById('linkResult').classList.add('show');
            document.getElementById('whatsappBox').style.display = 'block';
            
            showToast('✅ Pesan WhatsApp siap!');
        }
        
        function quickWhatsApp(name) {
            document.getElementById('guestName').value = name;
            generateWhatsApp();
            document.getElementById('linkResult').scrollIntoView({ behavior: 'smooth' });
        }
        
        function copyLink() {
            navigator.clipboard.writeText(currentGeneratedLink).then(() => {
                showToast('✅ Link dicopy!');
            }).catch(() => {
                showToast('❌ Gagal copy');
            });
        }
        
        function copyWhatsApp() {
            navigator.clipboard.writeText(currentGeneratedMessage).then(() => {
                showToast('✅ Pesan dicopy!');
            }).catch(() => {
                showToast('❌ Gagal copy');
            });
        }
        
        function openWhatsApp() {
            const encodedMessage = encodeURIComponent(currentGeneratedMessage);
            window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
        }
        
        function generateAllLinks() {
            let content = '========== DAFTAR LINK UNDANGAN ==========\n\n';
            content += 'Ranny & Sofyan - 08 Januari 2027\n';
            content += `Generated: ${new Date().toLocaleString('id-ID')}\n`;
            content += '='.repeat(50) + '\n\n';
            
            daftarTamu.forEach((guest, index) => {
                const encodedName = encodeURIComponent(guest.nama);
                const link = `${BASE_URL}?to=${encodedName}`;
                content += `${index + 1}. ${guest.nama} (${guest.kategori})\n`;
                content += `   ${link}\n\n`;
            });
            
            downloadFile(content, `Link-Undangan-${new Date().toISOString().split('T')[0]}.txt`, 'text/plain');
            showToast('✅ File didownload!');
        }
        
        function exportToCSV() {
            let csv = 'No,Nama,Kategori,Link Undangan\n';
            
            daftarTamu.forEach((guest, index) => {
                const encodedName = encodeURIComponent(guest.nama);
                const link = `${BASE_URL}?to=${encodedName}`;
                csv += `${index + 1},"${guest.nama}","${guest.kategori}","${link}"\n`;
            });
            
            downloadFile(csv, `Daftar-Tamu-${new Date().toISOString().split('T')[0]}.csv`, 'text/csv');
            showToast('✅ CSV didownload!');
        }
        
        function downloadFile(content, filename, type) {
            const blob = new Blob([content], { type });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
        
        init();
    </script>
</body>
</html>
